#
# kitty.conf
#

#------------------------------------------------------------------------------
# Font
#------------------------------------------------------------------------------
font_family     Mitsu-Inconsolata
font_size       15.0


#------------------------------------------------------------------------------
# Cursor
#------------------------------------------------------------------------------
cursor          #00FF9C
cursor_shape    beam



#------------------------------------------------------------------------------
# Color
#------------------------------------------------------------------------------
include theme.conf
background_opacity 0.9
dynamic_background_opacity yes



#------------------------------------------------------------------------------
# Tab bar
#------------------------------------------------------------------------------
tab_bar_edge        top
tab_bar_min_tabs    1
tab_bar_style       separator
tab_separator       " | "

active_tab_font_style   bold
inactive_tab_font_style normal
tab_bar_background      none



#------------------------------------------------------------------------------
# Wayland
#------------------------------------------------------------------------------
wayland_enable_ime yes



#------------------------------------------------------------------------------
# Keyboard shortcuts
#------------------------------------------------------------------------------
kitty_mod ctrl+shift
map kitty_mod+c copy_to_clipboard
map kitty_mod+v paste_from_clipboard


#
# Tab control
#
map shift+right next_tab
map shift+left  previous_tab
map shift+down  launch --type=tab --cwd=~
map ctrl+right  move_tab_forward
map ctrl+left   move_tab_backward

map kitty_mod+right next_tab
map kitty_mod+left  previous_tab
map kitty_mod+down  launch --type=tab --cwd=~


#
# Kitty window control
#
map kitty_mod+enter new_window
map kitty_mod+w     close_window
map kitty_mod+l     next_window
map kitty_mod+h     previous_window



